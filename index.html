<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Living Heritage Route</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<style>
/* ARCHITHE edition. Layout: catalogue sidebar left, satellite map right, detail card over the map.
   Monochrome interface, square geometry throughout; colour is kept only on the building-type markers. */
:root{
  --paper:#FFFFFF; --panel:#FFFFFF; --ink:#111111; --muted:#6B7375; --line:#E2E2E2; --rule:#111111;
  --accent:#111111; --soft:#F3F3F3; --road:#F2C14E;
  --display:"Poppins", "Segoe UI", Arial, sans-serif;
  --body:"Lato", "Segoe UI", Arial, sans-serif;
  --shadow:0 12px 32px rgba(0,0,0,.22);
  color-scheme:light;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{display:grid;grid-template-columns:380px minmax(0,1fr);height:100%}
.side{--panel:#15181C;--ink:#F2F2F2;--muted:#9BA3A9;--line:#2C3137;--soft:#22272D;--rule:#F2F2F2;display:flex;flex-direction:column;min-height:0;border-right:1px solid #000;background:var(--panel);color:var(--ink)}
.side-head{padding:22px 22px 18px}
.eyebrow{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font:700 26px/1.15 var(--display);margin:10px 0 8px;text-wrap:balance;padding-bottom:12px;border-bottom:2px solid var(--rule)}
.lede{margin:0;color:var(--ink);max-width:36ch}
.stats{display:flex;gap:22px;margin-top:14px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats b{display:block;font:700 22px var(--display);letter-spacing:0;color:var(--ink);text-transform:none}

.controls{padding:14px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:16px}
.label{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.label button{background:none;border:0;padding:0;font:700 11px var(--body);letter-spacing:.08em;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px 6px 8px;border:1px solid var(--ink);background:var(--panel);cursor:pointer;font-size:13px;transition:opacity .15s,background .15s}
.chip .dot{width:10px;height:10px}
.chip .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="false"]{opacity:.4;border-color:var(--line)}
.chip[aria-pressed="false"] .dot{background:transparent!important;border:1.5px solid var(--muted)}

.timeline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.play{width:32px;height:32px;border:1px solid var(--ink);background:var(--ink);cursor:pointer;display:grid;place-items:center}
.play svg{width:14px;height:14px;fill:var(--panel)}
input[type=range]{width:100%;accent-color:var(--ink)}
.yr{font:700 16px var(--display);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:6px}
.check input{accent-color:var(--ink)}

.listhead{padding:14px 22px 6px;display:flex;justify-content:space-between;align-items:baseline}
.listhead span{font:700 12px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.list{list-style:none;margin:0;padding:0 0 18px;overflow-y:auto;min-height:0;flex:1}
.item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 22px;cursor:pointer;border-bottom:1px solid var(--line)}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--ink)}
.side input[type=range],.side .check input{accent-color:#F2F2F2}
.item svg{width:30px;height:30px;display:block}
.item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .y{font:700 12px var(--body);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:20px 22px;color:var(--muted)}

.mapwrap{position:relative;min-width:0}
#map{position:absolute;inset:0;background:#2a2a2a}
.leaflet-container{font:inherit}
.leaflet-bar,.leaflet-bar a,.leaflet-control-layers{border-radius:0!important}
.pin{background:none;border:0}
.pin svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));transition:transform .15s}
.pin:hover svg{transform:scale(1.15)}
.pin.sel svg{transform:scale(1.3);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 5px rgba(255,255,255,.95))}
.cluster{background:none}
.cluster div{border-radius:50%;width:38px;height:38px;display:grid;place-items:center;background:#111;color:#fff;font:700 13px var(--body);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.leaflet-tooltip.road-tip{font:700 12px var(--body);border-radius:0}

.legend{position:absolute;left:12px;bottom:22px;z-index:900;background:rgba(17,17,17,.88);color:#fff;padding:8px 12px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.legend i{display:inline-block;width:28px;height:5px;background:var(--road);box-shadow:0 0 0 1.5px rgba(35,22,8,.8)}

.card{position:absolute;top:14px;right:14px;z-index:1001;width:370px;max-height:calc(100% - 28px);overflow-y:auto;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--ink)}
.photo{aspect-ratio:16/10;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden;background:#2b2b2b}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{display:grid;justify-items:center;gap:8px;color:#fff;text-align:center;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.photo .ph svg{width:84px;height:84px}
.photo .band{position:absolute;left:0;right:0;bottom:0;height:5px}
.close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:18px;line-height:1}
.cbody{padding:18px 20px 20px;display:grid;gap:16px}
.typechip{display:inline-flex;align-items:center;gap:7px;font:700 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.typechip .dot{width:10px;height:10px}
.card h2{font:700 22px/1.2 var(--display);margin:8px 0 0;text-wrap:balance}
.flag{display:inline-block;margin-top:10px;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--ink);padding:3px 7px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;margin:0;padding-top:12px;border-top:2px solid var(--rule)}
.facts dt{color:var(--muted);font:700 11px/1.9 var(--body);letter-spacing:.1em;text-transform:uppercase}
.facts dd{margin:0;font-size:14px}
.mono{font-variant-numeric:tabular-nums;font-weight:700}
.sec h3{font:700 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
.srcs{display:grid;gap:6px}
.src{display:grid;grid-template-columns:20px 30px minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.src .m{width:20px;height:20px;display:grid;place-items:center;font-size:12px;font-weight:700}
.src .yes{background:var(--ink);color:#fff}
.src .no{border:1px solid var(--line);color:var(--muted)}
.src .ab{font:700 12px var(--body);color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase}
.pill.High{background:var(--ink);color:#fff}
.pill.Medium{background:#8A9193;color:#fff}
.pill.Low{border:1px solid var(--ink);color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid var(--ink);background:var(--panel);text-decoration:none;color:var(--ink);font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn.primary{background:var(--ink);color:#fff}
.nav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.nav .btn{flex:1;justify-content:center}
.nav .btn[disabled]{opacity:.35;cursor:default}

@media (max-width:760px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto}
  .mapwrap{order:-1;height:62vh}
  .side{border-right:0}
  .list{overflow:visible}
  .card{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;max-height:72vh}
  .legend{bottom:12px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Catalogue">
    <header class="side-head">
      <div class="eyebrow">ARCHITHE · Research project</div>
      <h1>The Living Heritage Route</h1>
      <p class="lede">Mimar Sinan's works along the Sultan's Road from İstanbul to Edirne, in chronological order.</p>
      <div class="stats"><div><b id="stWorks">–</b>works</div><div><b id="stTypes">–</b>building types</div><div><b>1525–80s</b>period</div></div>
    </header>
    <div class="controls">
      <div>
        <div class="label">Building types <button type="button" id="allTypes">Show all</button></div>
        <div class="chips" id="chips"></div>
      </div>
      <div>
        <div class="label">Built by year</div>
        <div class="timeline">
          <button class="play" id="play" type="button" aria-label="Play timeline"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2.5v11l9-5.5z"/></svg></button>
          <input type="range" id="year" min="1525" max="1590" step="1" value="1590" aria-label="Show works built up to this year">
          <span class="yr" id="yearOut">1590</span>
        </div>
        <label class="check"><input type="checkbox" id="undated" checked> Include undated works (<span id="nUndated">0</span>)</label>
      </div>
    </div>
    <div class="listhead"><div class="label" style="margin:0">Works</div><span id="count"></span></div>
    <ul class="list" id="list"></ul>
  </aside>
  <main class="mapwrap">
    <div id="map" role="region" aria-label="Map"></div>
    <div class="legend"><i></i>Imperial road (Sol Kol)</div>
    <article class="card" id="card" hidden aria-live="polite"></article>
  </main>
</div>

/* ===== PHOTOS =====
   Put image files in a folder called "photos" next to this file, then add a line per building:
   ID number : "photos/file-name.jpg"   e.g.  31: "photos/selimiye.jpg",                          */
const PHOTOS = {
};
const SOURCES = [["TB","Tezkiretü'l-Bünyan"],["TE","Tezkiretü'l-Ebniye"],["TM","Tuhfetü'l-Mi'marin"]];

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const groupOf = w => GROUPS.find(g => g.key === TYPES[w.icon].group);

const state = { groups: new Set(GROUPS.map(g => g.key)), year: 1590, undated: true, sel: null, playing: null };

/* ===== map ===== */
const map = L.map("map", { zoomControl: false, attributionControl: true, minZoom: 6, maxZoom: 19 });
L.control.zoom({ position: "bottomright" }).addTo(map);
map.createPane("labels"); map.getPane("labels").style.zIndex = 350; map.getPane("labels").style.pointerEvents = "none";
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const satellite = L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery © Esri, Maxar, Earthstar Geographics" }).addTo(map);
const places = L.tileLayer(ESRI + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, pane: "labels" }).addTo(map);
const street = L.tileLayer(ESRI + "World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "© Esri" });
L.control.layers({ "Satellite": satellite, "Topographic": street }, { "Place names": places }, { position: "topleft" }).addTo(map);

L.polyline(ROAD, { color: "#23160a", weight: 7, opacity: .65, interactive: false, lineCap: "round", lineJoin: "round" }).addTo(map);
L.polyline(ROAD, { color: "#F2C14E", weight: 3.2, opacity: 1, lineCap: "round", lineJoin: "round" })
  .bindTooltip("Imperial road (Sol Kol), İstanbul – Edirne", { sticky: true, className: "road-tip" }).addTo(map);

const cluster = L.markerClusterGroup({
  maxClusterRadius: 34, showCoverageOnHover: false, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 17,
  iconCreateFunction: c => L.divIcon({ html: "<div>" + c.getChildCount() + "</div>", className: "cluster", iconSize: [38, 38] })
});
map.addLayer(cluster);

const markers = new Map();
WORKS.forEach(w => {
  const m = L.marker([w.lat, w.lon], {
    title: w.name,
    icon: L.divIcon({ html: TYPES[w.icon].svg, className: "pin", iconSize: [30, 30], iconAnchor: [15, 15] })
  });
  m.on("click", () => select(w.id, false));
  markers.set(w.id, m);
});

const allPts = WORKS.map(w => [w.lat, w.lon]).concat(ROAD.flat());
map.fitBounds(L.latLngBounds(allPts), { padding: [30, 30] });

/* ===== filters ===== */
function visible(w) {
  if (!state.groups.has(TYPES[w.icon].group)) return false;
  if (w.yearN == null) return state.undated;
  return w.yearN <= state.year;
}
function renderChips() {
  $("#chips").innerHTML = GROUPS.map(g => {
    const n = WORKS.filter(w => TYPES[w.icon].group === g.key).length;
    return `<button type="button" class="chip" data-g="${g.key}" aria-pressed="${state.groups.has(g.key)}"><span class="dot" style="background:${g.color}"></span>${esc(g.name)}<span class="n">${n}</span></button>`;
  }).join("");
}
function apply() {
  const vis = WORKS.filter(visible);
  cluster.clearLayers();
  cluster.addLayers(vis.map(w => markers.get(w.id)));
  $("#count").textContent = vis.length === WORKS.length ? `${vis.length}` : `${vis.length} of ${WORKS.length}`;
  $("#list").innerHTML = vis.length ? vis.map(w => `
    <li class="item" data-id="${w.id}" tabindex="0" aria-current="${w.id === state.sel}">
      ${TYPES[w.icon].svg}
      <div style="min-width:0"><div class="nm">${esc(w.name)}</div><div class="sub">${esc(TYPES[w.icon].tr)} · ${esc(w.location)}</div></div>
      <span class="y">${esc(w.yearShort)}</span>
    </li>`).join("") : `<li class="empty">No works match these filters.</li>`;
  if (state.sel != null && !vis.some(w => w.id === state.sel)) closeCard();
  else if (state.sel != null) renderCard(WORKS.find(w => w.id === state.sel));
}

$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const g = b.dataset.g;
  // first click isolates a group; later clicks toggle
  if (state.groups.size === GROUPS.length) state.groups = new Set([g]);
  else if (state.groups.has(g)) { state.groups.delete(g); if (!state.groups.size) state.groups = new Set(GROUPS.map(x => x.key)); }
  else state.groups.add(g);
  renderChips(); apply();
});
$("#allTypes").addEventListener("click", () => { state.groups = new Set(GROUPS.map(g => g.key)); renderChips(); apply(); });
$("#year").addEventListener("input", e => { state.year = +e.target.value; $("#yearOut").textContent = state.year; apply(); });
$("#undated").addEventListener("change", e => { state.undated = e.target.checked; apply(); });
$("#play").addEventListener("click", () => {
  if (state.playing) return stopPlay();
  if (state.year >= 1590) { state.year = 1525; }
  $("#playIcon").innerHTML = '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/>';
  $("#play").setAttribute("aria-label", "Pause timeline");
  state.playing = setInterval(() => {
    state.year = Math.min(1590, state.year + 1);
    $("#year").value = state.year; $("#yearOut").textContent = state.year; apply();
    if (state.year >= 1590) stopPlay();
  }, 160);
});
function stopPlay() {
  clearInterval(state.playing); state.playing = null;
  $("#playIcon").innerHTML = '<path d="M4 2.5v11l9-5.5z"/>';
  $("#play").setAttribute("aria-label", "Play timeline");
}

/* ===== list & selection ===== */
$("#list").addEventListener("click", e => { const li = e.target.closest(".item"); if (li) select(+li.dataset.id, true); });
$("#list").addEventListener("keydown", e => { if (e.key === "Enter") { const li = e.target.closest(".item"); if (li) select(+li.dataset.id, true); } });

function select(id, fly) {
  const prev = state.sel; state.sel = id;
  const w = WORKS.find(x => x.id === id);
  document.querySelectorAll(".item").forEach(li => li.setAttribute("aria-current", +li.dataset.id === id));
  markSelected(prev, false);
  const m = markers.get(id);
  if (fly) cluster.zoomToShowLayer(m, () => { map.panTo(m.getLatLng()); markSelected(id, true); });
  else markSelected(id, true);
  renderCard(w);
  const li = document.querySelector(`.item[data-id="${id}"]`); if (li) li.scrollIntoView({ block: "nearest" });
}
function markSelected(id, on) {
  if (id == null) return;
  const el = markers.get(id)?.getElement?.(); if (el) el.classList.toggle("sel", on);
}
map.on("zoomend moveend", () => markSelected(state.sel, true));

function renderCard(w) {
  const t = TYPES[w.icon], g = groupOf(w);
  const vis = WORKS.filter(visible), i = vis.findIndex(x => x.id === w.id);
  const prev = vis[i - 1], next = vis[i + 1];
  const photo = PHOTOS[w.id];
  const gmaps = `https://www.google.com/maps/search/?api=1&query=${w.lat},${w.lon}`;
  $("#card").innerHTML = `
    <div class="photo">
      ${photo ? `<img src="${esc(photo)}" alt="${esc(w.name)} ${esc(t.en)}">`
              : `<div class="ph">${t.svgLarge}<span>Photo to be added</span></div>`}
      <span class="band" style="background:${g.color}"></span>
      <button class="close" type="button" aria-label="Close" id="closeCard">×</button>
    </div>
    <div class="cbody">
      <div>
        <span class="typechip"><span class="dot" style="background:${g.color}"></span>${esc(t.tr)} · ${esc(t.en)}</span>
        <h2>${esc(w.name)}</h2>
        ${w.flag ? `<span class="flag" title="Marked with (!) in the source list">Flagged (!) in the source list</span>` : ""}
      </div>
      <dl class="facts">
        <dt>Date</dt><dd class="mono">${esc(w.year)}</dd>
        <dt>Place</dt><dd>${esc(w.location)}, ${esc(w.province)}</dd>
        <dt>Address</dt><dd>${esc(w.address)}</dd>
        <dt>Status</dt><dd>${esc(w.status)}</dd>
        <dt>Location</dt><dd><span class="pill ${esc(w.conf)}">${esc(w.conf)} confidence</span></dd>
      </dl>
      <div class="sec">
        <h3>Listed in Sinan's autobiographies</h3>
        <div class="srcs">${SOURCES.map(([k, n]) => {
          const on = w.src[k] === "V";
          return `<div class="src"><span class="m ${on ? "yes" : "no"}">${on ? "✓" : "–"}</span><span class="ab">${k}</span><span>${n}</span></div>`;
        }).join("")}</div>
      </div>
      ${w.notes ? `<div class="sec"><h3>Research notes</h3><p class="note">${esc(w.notes)}</p></div>` : ""}
      <div class="actions">
        <a class="btn primary" href="${gmaps}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
        <button class="btn" type="button" id="zoomTo">Zoom to building</button>
      </div>
      <div class="nav">
        <button class="btn" type="button" id="prevW" ${prev ? "" : "disabled"}>← Earlier</button>
        <button class="btn" type="button" id="nextW" ${next ? "" : "disabled"}>Later →</button>
      </div>
    </div>`;
  $("#card").hidden = false;
  $("#closeCard").onclick = closeCard;
  $("#zoomTo").onclick = () => cluster.zoomToShowLayer(markers.get(w.id), () => { map.setView([w.lat, w.lon], 17); markSelected(w.id, true); });
  if (prev) $("#prevW").onclick = () => select(prev.id, true);
  if (next) $("#nextW").onclick = () => select(next.id, true);
}
function closeCard() {
  markSelected(state.sel, false); state.sel = null; $("#card").hidden = true;
  document.querySelectorAll(".item").forEach(li => li.setAttribute("aria-current", "false"));
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sel != null) closeCard(); });

/* ===== init ===== */
$("#stWorks").textContent = WORKS.length;
$("#stTypes").textContent = new Set(WORKS.map(w => w.icon)).size;
$("#nUndated").textContent = WORKS.filter(w => w.yearN == null).length;
renderChips(); apply();
</script>
</body>
</html>
